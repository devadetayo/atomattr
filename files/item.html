<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07080a" />
  <title>Design — AtomAttr UI</title>
  <meta name="description" content="Preview a free AtomAttr UI design, inspect its layers and attributes, copy the source and open it in the Playground." />
  <link rel="icon" href="assets/favico/favico.png" type="image/png" />
  <link rel="stylesheet" href="./dist/defaults.css" />
  <link rel="stylesheet" href="./assets/showcase.css" />
  <link rel="stylesheet" href="./assets/remixicon/remixicon.css" />
  <style>
    pre code, pre code * { background: none !important; padding: 0 !important; margin: 0 !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; font-weight: 400 !important; font-style: normal !important; }
  </style>
</head>
<body bg="#fff" dark-bg="#07080a" text="text" m="0" p="0" font-family="sans">

  <div id="app" aria-busy="true">
    <div display="flex" items="center" justify="center" text="muted" min-h="100vh">Loading…</div>
  </div>

  <div id="toast" position="fixed" left="0" right="0" bottom="6" display="none" justify="center" z="200" role="status" aria-live="polite">
    <span id="toast-msg" bg="gray-950" dark-bg="#fff" text="white" dark-text="gray-950" font-size="sm" font-weight="600" px="4" py="2.5" rounded="full"></span>
  </div>

  <script src="./dist/atomattr.min.js" defer></script>
  <script type="module" src="./item.js"></script>
</body>
</html>
